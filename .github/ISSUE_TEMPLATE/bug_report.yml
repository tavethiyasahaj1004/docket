name: Bug report
description: Something in Docket doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this. **Do not report security
        vulnerabilities here** — see [SECURITY.md](https://github.com/stack256org/docket/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as an agent
        2. Open a ticket
        3. …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: "Output of `curl your-instance/api/health`, an image tag, or a commit SHA."
      placeholder: "1.0.0 / sha-a1b2c3d / main"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options:
        - Docker Compose, prebuilt image (docker-compose.yml)
        - Docker Compose, own database (docker-compose.external-db.yml)
        - Docker Compose, built from source (docker-compose.build.yml)
        - Local development (pnpm dev)
        - Other / platform PaaS (Railway, Render, Fly, Coolify, Dokploy…)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Customer portal
        - Agent portal
        - Admin portal
        - Public API (/api/v1)
        - Webhooks
        - Email / notifications
        - Background worker
        - File attachments / storage
        - Install, Docker, or migrations
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        `docker compose logs app worker` — or the browser console for a UI bug.
        **Redact `APP_SECRET`, API keys, SMTP credentials, and customer email addresses.**
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, config details (with secrets removed), or things you already ruled out.
